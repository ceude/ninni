<!doctype html>
<html lang="tr" data-theme="girl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ninni</title>
<meta name="description" content="Ninni · Minik Defter">
<meta name="theme-color" content="#fff7f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icon-180.png?v=2">

<style>
:root{
  --r:22px; --r-sm:14px; --gap:14px;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hand:'Caveat','Bradley Hand',cursive;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
/* ── pembe */
:root[data-theme="girl"]{--bg:#fff7f8;--card:#ffffff;--soft:#fbe9ee;--soft2:#f7dbe3;--accent:#eaa6bb;--deep:#c4708c;--ink:#4b3a41;--muted:#9c8a91;--line:#f1dfe5;--glow:rgba(234,166,187,.28)}
/* ── mavi */
:root[data-theme="boy"]{--bg:#f5f9fd;--card:#ffffff;--soft:#e5eff9;--soft2:#d6e6f5;--accent:#a3c6e7;--deep:#5c8dbb;--ink:#35424f;--muted:#8693a0;--line:#dfe9f3;--glow:rgba(163,198,231,.3)}
/* ── bekleme rengi: şeftali + lila */
:root[data-theme="wait"]{--bg:#fff8f4;--card:#ffffff;--soft:#fbeee6;--soft2:#efe4f6;--accent:#f0bf9f;--deep:#9f84c4;--ink:#463d4b;--muted:#9a8e9c;--line:#f2e6e4;--glow:rgba(240,191,159,.3)}
@media (prefers-color-scheme: dark){
  :root[data-theme="girl"]{--bg:#1c1619;--card:#261e22;--soft:#33252b;--soft2:#3d2b33;--accent:#d98fa8;--deep:#efb3c6;--ink:#f1e3e8;--muted:#a8939b;--line:#3a2c32;--glow:rgba(217,143,168,.18)}
  :root[data-theme="boy"]{--bg:#151a1f;--card:#1d242b;--soft:#243241;--soft2:#2b3c4e;--accent:#86b2da;--deep:#b5d3ef;--ink:#e3ebf3;--muted:#8d9aa7;--line:#2a3541;--glow:rgba(134,178,218,.18)}
  :root[data-theme="wait"]{--bg:#1b1719;--card:#251f23;--soft:#33282a;--soft2:#30283b;--accent:#d9a283;--deep:#c3aee3;--ink:#efe6ec;--muted:#a3979f;--line:#382e33;--glow:rgba(217,162,131,.18)}
}
/* ── gece modu: kırmızımsı, karartılmış */
html.night[data-theme]{--bg:#000;--card:#120505;--soft:#1b0707;--soft2:#240a0a;--accent:#6e1c1a;--deep:#b2463d;--ink:#c0564c;--muted:#7d3a34;--line:#260c0b;--glow:rgba(120,30,25,.25)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45}
body{min-height:100dvh;overscroll-behavior-y:none;transition:background .6s ease,color .6s ease}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%;display:block}
a{color:var(--deep)}
.hand{font-family:var(--hand)}
#app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 110px)}
#app.noNav{padding-bottom:calc(var(--safe-b) + 30px)}

/* kartlar */
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:0 0 var(--gap);box-shadow:0 6px 24px var(--glow);border:1px solid var(--line);transition:background .6s,border-color .6s}
.card.soft{background:var(--soft);box-shadow:none}
.card h3{margin:0 0 6px;font-size:1.05rem;font-weight:800}
.card p{margin:4px 0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.center{text-align:center}
.stack>*+*{margin-top:10px}
.hr{height:1px;background:var(--line);margin:14px 0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);font-size:.85rem;font-weight:700}

/* butonlar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;background:var(--deep);color:#fff;font-weight:800;box-shadow:0 6px 18px var(--glow);transition:transform .15s, opacity .2s}
html.night .btn:not(.ghost):not(.line){color:#000}
.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.line{background:transparent;color:var(--deep);border:2px solid var(--soft2);box-shadow:none}
.btn.sm{min-height:40px;padding:0 16px;font-size:.92rem}
.btn[disabled]{opacity:.45}
.link{color:var(--deep);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.icon-btn{width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;background:var(--soft);font-weight:700;font-size:.92rem;border:2px solid transparent}
.chip.on{border-color:var(--deep);background:var(--card)}

/* form */
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;font-weight:700;margin:0 0 6px;font-size:.92rem}
.in{width:100%;min-height:52px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--card);padding:12px 14px;outline:none;transition:border-color .2s}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:110px;resize:vertical}
textarea.in.hand{font-size:1.45rem;line-height:1.3}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--soft2);transition:.25s}
.sw i:after{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:.25s}
.sw input:checked+i{background:var(--deep)}
.sw input:checked+i:after{left:23px}

/* başlık */
.top{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.top h1{font-size:1.3rem;margin:0;font-weight:800}
.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:var(--soft2);flex:none;display:flex;align-items:center;justify-content:center;font-size:1.5rem;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ana sayaç */
.hero{position:relative;overflow:hidden;text-align:center;padding:26px 18px 22px;background:linear-gradient(160deg,var(--soft),var(--card))}
.hero .big{font-family:var(--hand);font-size:2.6rem;line-height:1.05;margin:6px 0 2px;color:var(--deep)}
.hero .photo{width:118px;height:118px;border-radius:50%;margin:0 auto 6px;border:5px solid var(--card);box-shadow:0 8px 26px var(--glow);object-fit:cover;background:var(--soft2);display:flex;align-items:center;justify-content:center;font-size:2.4rem;overflow:hidden}
.hero .photo img{width:100%;height:100%;object-fit:cover}

/* hızlı kayıt */
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:78px;border-radius:18px;background:var(--soft);font-weight:800;font-size:.82rem;transition:transform .15s,background .3s}
.qbtn:active{transform:scale(.95)}
.qbtn .e{font-size:1.5rem;line-height:1}
.qbtn.run{background:var(--deep);color:#fff}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.summary>div{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.summary b{display:block;font-size:.95rem}
.summary span{font-size:.78rem;color:var(--muted)}

/* kırk gün halkası */
.ring{--p:0;width:74px;height:74px;border-radius:50%;flex:none;background:conic-gradient(var(--deep) calc(var(--p)*1%),var(--soft2) 0);display:flex;align-items:center;justify-content:center}
.ring>div{width:60px;height:60px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem}

/* zaman tüneli */
.day-h{font-weight:800;color:var(--muted);font-size:.85rem;margin:20px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.mem{display:flex;gap:12px;align-items:flex-start}
.mem .ph{width:84px;height:84px;border-radius:14px;object-fit:cover;flex:none;background:var(--soft2);overflow:hidden}
.mem .ph img{width:100%;height:100%;object-fit:cover}
.mem .txt{font-family:var(--hand);font-size:1.5rem;line-height:1.2}
.tag{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--deep)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 .ph{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft2)}
.grid3 .ph img{width:100%;height:100%;object-fit:cover}

/* alt menü */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 10px calc(var(--safe-b) + 8px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav.tabs .in2{display:flex;max-width:560px;width:100%;justify-content:space-around}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;min-height:54px;justify-content:center;border-radius:16px;color:var(--muted);font-size:.74rem;font-weight:800}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--deep);background:var(--soft)}

/* alt sayfa (sheet) */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(30,20,25,.38);animation:fade .25s}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 18px calc(var(--safe-b) + 24px);animation:up .32s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;overscroll-behavior:contain}
#sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
#sheet h2{margin:2px 0 14px;font-size:1.25rem}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

/* onboarding */
.ob{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center;gap:18px;animation:fade .5s}
.ob .q{font-family:var(--hand);font-size:2.4rem;line-height:1.1;color:var(--deep);margin:0}
.ob .big-choice{display:grid;gap:12px}
.ob .big-choice button{min-height:76px;border-radius:24px;background:var(--card);border:2px solid var(--line);font-size:1.2rem;font-weight:800;box-shadow:0 6px 20px var(--glow)}
.ob .dots{display:flex;gap:6px;justify-content:center}
.ob .dots i{width:8px;height:8px;border-radius:9px;background:var(--soft2)}
.ob .dots i.on{background:var(--deep);width:22px}

/* gece */
.night-wrap{display:flex;flex-direction:column;gap:14px;min-height:calc(100dvh - 140px)}
.nbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
.nbtn{border-radius:26px;background:var(--soft);min-height:120px;font-size:1.35rem;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line)}
.nbtn small{font-size:.8rem;font-weight:600;color:var(--muted)}
.nbtn.run{background:var(--accent);color:#000;border-color:var(--deep)}
.nbtn.run small{color:#1a0000}
.ninfo{text-align:center;font-size:1.1rem}
.ninfo b{font-size:1.5rem}

/* nefes */
.breath{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:60dvh}
.breath .c{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--accent),var(--soft2));box-shadow:0 0 60px var(--glow);transition:transform 4s ease-in-out}
.breath .c.in{transform:scale(2)}
.breath .c.out{transform:scale(1);transition-duration:6s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* kamera */
#cam{position:fixed;inset:0;z-index:70;background:#000;display:none}
#cam.open{display:block}
#cam video,#cam .ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam .ghost{opacity:.32;pointer-events:none}
#cam .frame{position:absolute;inset:12% 8%;border:2px dashed rgba(255,255,255,.55);border-radius:28px;pointer-events:none}
#cam .bar{position:absolute;left:0;right:0;bottom:0;padding:20px 20px calc(var(--safe-b) + 24px);display:flex;justify-content:space-around;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.6))}
#cam .shot{width:78px;height:78px;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.4)}
#cam .bar button{color:#fff;font-weight:800}

/* kağıt mektup */
.paper{background:#fbf6ec;color:#3d342f;border-radius:6px;padding:28px 22px;box-shadow:0 10px 30px rgba(0,0,0,.12);font-family:var(--hand);font-size:1.45rem;line-height:1.35;background-image:repeating-linear-gradient(transparent 0 37px,rgba(120,100,80,.12) 37px 38px)}
.paper h2{font-size:2rem;margin:0 0 10px;color:#7b5a4f}
.paper p{margin:0 0 12px;white-space:pre-wrap}
.preview-img{width:100%;border-radius:16px;box-shadow:0 8px 26px rgba(0,0,0,.15)}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);min-height:58px}
.list-item:last-child{border-bottom:0}
.shop-item{font-size:1.1rem;font-weight:700}
.shop-item.done .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.check{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--accent);flex:none;display:flex;align-items:center;justify-content:center}
.done .check{background:var(--deep);border-color:var(--deep);color:#fff}
svg.chart{width:100%;height:auto;display:block}
.fade-in{animation:fade .5s}
/* iOS Safari: sağ alttaki ••• düğmesini gösteren ok */
.dots-hint{position:fixed;right:14px;bottom:calc(var(--safe-b) + 8px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:2px;color:var(--deep);font-weight:800;pointer-events:none;animation:nudge 1.4s ease-in-out infinite}
.dots-hint span{font-size:.8rem;background:var(--card);padding:4px 10px;border-radius:999px;box-shadow:0 4px 14px var(--glow)}
.dots-hint b{font-size:1.4rem;letter-spacing:2px;line-height:1;margin-right:6px}
.dots-hint i{font-style:normal;font-size:2.6rem;line-height:1;margin-right:2px}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,8px)}}
.hidden{display:none!important}
</style>
</head>

/* ── giden kuyruğu */
let pushing = false;
async function queue(item) { if (S.local) return; await IDB.put('outbox', item); kick(); }
function kick() { clearTimeout(kick.t); kick.t = setTimeout(() => sync(), 400); }

async function push() {
  if (!S.sb || !S.online || pushing) return; pushing = true;
  try {
    for (const [key, it] of await IDB.allWithKeys('outbox')) {
      let error = null;
      if (it.t === 'entries') {
        const e = S.entries.get(it.id);
        if (e) { ({ error } = await S.sb.from('entries').upsert(only(e, ENTRY_COLS))); if (!error) { e._dirty = false; await IDB.put('entries', e); } }
      } else if (it.t === 'babies') {
        const b = S.babies.find(x => x.id === it.id) || await IDB.get('babies', it.id);
        if (b) { ({ error } = await S.sb.from('babies').upsert(only(b, BABY_COLS))); if (!error) { b._dirty = false; await IDB.put('babies', b); } }
      } else if (it.t === 'upload') {
        const blob = await localBlob(it.path);
        if (blob) { ({ error } = await S.sb.storage.from('ninni').upload(it.path, blob, { contentType: blob.type || 'image/jpeg', upsert: false })); if (error && /exists|Duplicate/i.test(error.message)) error = null; }
      } else if (it.t === 'member') {
        if (Object.keys(it.patch).length) ({ error } = await S.sb.from('members').update(it.patch).eq('family_id', S.family).eq('user_id', meId()));
      }
      if (error) {
        console.warn('push', it, error);
        if (/42501|row-level|permission|violates/i.test(error.code + ' ' + error.message)) { await IDB.del('outbox', key); continue; } // izin yok: tekrar denemenin anlamı yok
        break;
      }
      await IDB.del('outbox', key);
    }
  } finally { pushing = false; }
}

async function pull(full = false) {
  if (!S.sb || !S.online || !S.family) return;
  const fam = S.family;
  const [{ data: mem }, { data: gr }, { data: bb }] = await Promise.all([
    S.sb.from('members').select('*').eq('family_id', fam),
    S.sb.from('grants').select('*').eq('family_id', fam),
    S.sb.from('babies').select('*').eq('family_id', fam),
  ]);
  if (mem) {
    S.members = mem; await kv.set('members', mem);
    const mine = mem.find(m => m.user_id === meId());
    if (mine) { Object.assign(S.me, { role: mine.role, display_name: mine.display_name, parent_kind: mine.parent_kind, relation: mine.relation, show_awake: mine.show_awake }); await kv.set('me', S.me); }
    else { await leftFamily(); return; } // aileden çıkarıldı ya da aile silindi
  }
  if (gr) {
    const changed = JSON.stringify(gr) !== JSON.stringify(S.grants);
    S.grants = gr; await kv.set('grants', gr);
    if (changed && !full) { await kv.set('cursor', null); return pull(true); } // izinler değişti: baştan çek
  }
  if (bb) {
    for (const b of bb) { const loc = S.babies.find(x => x.id === b.id); if (!loc?._dirty) await IDB.put('babies', b); }
    S.babies = (await IDB.all('babies')).filter(b => !b.deleted && b.family_id === fam);
    if (!S.babyId || !S.babies.find(b => b.id === S.babyId)) S.babyId = S.babies[0]?.id;
  }
  let cursor = full ? null : await kv.get('cursor');
  if (full) { // görünürlüğü kaybolanları temizle
    const keep = new Set(); let from = 0;
    while (true) {
      const { data, error } = await S.sb.from('entries').select('*').eq('family_id', fam).order('updated_at').range(from, from + 999);
      if (error || !data) break; await applyRows(data); data.forEach(r => keep.add(r.id));
      if (data.length < 1000) break; from += 1000;
    }
    for (const [id, e] of S.entries) if (!keep.has(id) && !e._dirty) { S.entries.delete(id); await IDB.del('entries', id); }
    cursor = [...S.entries.values()].reduce((m, e) => e.updated_at > m ? e.updated_at : m, '1970-01-01');
  } else {
    while (true) {
      let q = S.sb.from('entries').select('*').eq('family_id', fam).order('updated_at').limit(1000);
      if (cursor) q = q.gt('updated_at', new Date(new Date(cursor) - 5000).toISOString()); // 5 sn örtüşme
      const { data, error } = await q; if (error || !data) break;
      await applyRows(data);
      if (data.length) cursor = data[data.length - 1].updated_at;
      if (data.length < 1000) break;
    }
  }
  if (cursor) await kv.set('cursor', cursor);
}
async function applyRows(rows) {
  const put = [];
  for (const r of rows) { const loc = S.entries.get(r.id); if (loc?._dirty) continue; S.entries.set(r.id, r); put.push(r); }
  if (put.length) await IDB.putMany('entries', put);
}

let syncing = null;
async function sync({ full = false, quiet = true } = {}) {
  if (!S.sb || S.local || !S.family) return;
  if (syncing) return syncing;
  syncing = (async () => {
    try { await push(); await pull(full); await push(); refresh(); }
    catch (e) { console.warn('sync', e); }
    finally { syncing = null; }
  })();
  return syncing;
}

let channel;
function subscribe() {
  if (!S.sb || channel || !S.family) return;
  channel = S.sb.channel('fam-' + S.family)
    .on('postgres_changes', { event: '*', schema: 'ninni', table: 'entries', filter: 'family_id=eq.' + S.family }, async p => { if (p.new?.id) { await applyRows([p.new]); refresh(); } })
    .on('postgres_changes', { event: '*', schema: 'ninni', table: 'members', filter: 'family_id=eq.' + S.family }, () => kick())
    .on('postgres_changes', { event: '*', schema: 'ninni', table: 'babies', filter: 'family_id=eq.' + S.family }, () => kick())
    .subscribe();
}

/* ── fotoğraflar */
const photoCache = new Map();
async function compressImage(fileOrBlob, max = 1600, q = .82) {
  const url = URL.createObjectURL(fileOrBlob);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
/* Fotoğraflar IndexedDB'de Blob olarak DEĞİL ham veri (ArrayBuffer) olarak saklanır: iOS'ta ana ekran
   uygulaması yeniden açılınca saklı Blob'lar okunamaz hale gelebiliyor ("WebKitBlobResource error"). */
const DIAG = { localErr: 0, putErr: 0, dlErr: 0, dlOk: 0, last: '' };
const diagNote = (k, e) => { DIAG[k]++; DIAG.last = `${k}: ${e?.message || e?.name || e}`; };
async function putBlob(path, blob) {
  try { await IDB.put('blobs', { type: blob.type || 'image/jpeg', buf: await blob.arrayBuffer() }, path); return true; }
  catch (e) { diagNote('putErr', e); return false; } // telefona yazılamasa da fotoğraf gösterilir
}
async function localBlob(path) {
  let v;
  try { v = await IDB.get('blobs', path); } catch (e) { diagNote('localErr', e); try { await IDB.del('blobs', path); } catch (_) { } return null; }
  if (!v) return null;
  try {
    if (v.buf) { if (!v.buf.byteLength) throw new Error('boş'); return new Blob([v.buf], { type: v.type || 'image/jpeg' }); }
    const buf = await v.arrayBuffer(); if (!buf.byteLength) throw new Error('boş');
    await putBlob(path, new Blob([buf], { type: v.type || 'image/jpeg' })); return new Blob([buf], { type: v.type || 'image/jpeg' });
  } catch (e) { diagNote('localErr', e); try { await IDB.del('blobs', path); } catch (_) { } return null; } // bozuk: sil, sunucudan gelsin
}
async function storePhoto(blob) {
  const path = `${S.family}/${uuid()}.jpg`;
  await putBlob(path, blob);
  photoCache.set(path, URL.createObjectURL(blob));
  await queue({ t: 'upload', path });
  return path;
}
async function remoteBlob(path) {
  if (!S.sb) return null;
  try {
    const { data, error } = await S.sb.storage.from('ninni').download(path);
    if (error) throw error;
    if (!data?.size) throw new Error('boş dosya');
    DIAG.dlOk++;
    const blob = new Blob([await data.arrayBuffer()], { type: data.type || 'image/jpeg' });
    await putBlob(path, blob); return blob;
  } catch (e) { diagNote('dlErr', e); return null; }
}
async function photoBlob(path) { if (!path) return null; return (await localBlob(path)) || remoteBlob(path); }
async function photoURL(path) {
  if (!path) return null;
  if (photoCache.has(path)) return photoCache.get(path);
  const b = await photoBlob(path).catch(e => { diagNote('localErr', e); return null; }); if (!b) return null;
  const u = URL.createObjectURL(b); photoCache.set(path, u); return u;
}
async function photoRepair(path) { // görüntü açılamadı: yerel kopyayı at, sunucudan yeniden indir
  photoCache.delete(path); try { await IDB.del('blobs', path); } catch (_) { }
  const b = await remoteBlob(path); if (!b) return null;
  const u = URL.createObjectURL(b); photoCache.set(path, u); return u;
}

function hydrate(root = document) {
  $$('[data-photo]', root).forEach(async el => {
    const p = el.dataset.photo; if (!p || el.dataset.done === p) return;
    const u = await photoURL(p); if (!u) return;
    el.dataset.done = p;
    const img = new Image(); img.alt = ''; img.decoding = 'async';
    img.onerror = async () => { if (img.dataset.retried) return; img.dataset.retried = '1'; const nu = await photoRepair(p); if (nu) img.src = nu; };
    img.src = u; el.replaceChildren(img);
  });
}

/* ── EXIF çekim tarihi (galeriden toplu eklemede doğru güne yerleştirmek için) */
async function exifDate(file) {
  try {
    const buf = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (buf.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o < buf.byteLength - 4) {
      const mk = buf.getUint16(o), len = buf.getUint16(o + 2);
      if (mk === 0xFFE1 && buf.getUint32(o + 4) === 0x45786966) {
        const tf = o + 10, le = buf.getUint16(tf) === 0x4949;
        const u16 = p => buf.getUint16(tf + p, le), u32 = p => buf.getUint32(tf + p, le);
        const readStr = (p, n) => { let s = ''; for (let i = 0; i < n - 1; i++) s += String.fromCharCode(buf.getUint8(tf + p + i)); return s; };
        const scan = (ifd, tags) => { const n = u16(ifd); const out = {}; for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12, tag = u16(e); if (tags.includes(tag)) out[tag] = { cnt: u32(e + 4), val: u32(e + 8) }; } return out; };
        const ifd0 = scan(u32(4), [0x8769, 0x0132]);
        let raw = null;
        if (ifd0[0x8769]) { const ex = scan(ifd0[0x8769].val, [0x9003]); if (ex[0x9003]) raw = readStr(ex[0x9003].val, ex[0x9003].cnt); }
        if (!raw && ifd0[0x0132]) raw = readStr(ifd0[0x0132].val, ifd0[0x0132].cnt);
        const m = raw && raw.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);
        return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) : null;
      }
      if ((mk & 0xFF00) !== 0xFF00) break; o += 2 + len;
    }
  } catch (e) { }
  return null;
}

function initSupabase() {

  });

async function ensureSession() {
  const { data: { session } } = await S.sb.auth.getSession();
  if (session) return (S.session = session);
  const { data, error } = await S.sb.auth.signInAnonymously();
  if (error) throw error;
  return (S.session = data.session);
}
async function rpc(fn, args) { const { data, error } = await S.sb.rpc(fn, args); if (error) throw error; return data; }

/* Bulut bağlanmadan önce yerelde başlandıysa: her şeyi aileye taşı */
async function migrateLocalToCloud() {
  if (!S.sb || !S.me?.localOnly) return;
  await ensureSession();
  const uid = S.session.user.id; const b0 = S.babies[0];
  const fam = await rpc('create_family', { p_name: S.me.display_name, p_parent_kind: S.me.parent_kind, p_baby: only(b0, BABY_COLS) });
  const oldFam = S.family, oldUid = S.me.user_id;
  S.family = fam; S.local = false;
  Object.assign(S.me, { user_id: uid, family_id: fam, localOnly: false }); await kv.set('me', S.me);
  for (const b of S.babies) { b.family_id = fam; await IDB.put('babies', b); if (b !== b0) await queue({ t: 'babies', id: b.id }); }
  for (const [k, blob] of await IDB.allWithKeys('blobs')) {
    if (k.startsWith(oldFam + '/')) { const nk = fam + k.slice(oldFam.length); await IDB.put('blobs', blob, nk); await IDB.del('blobs', k); await queue({ t: 'upload', path: nk }); }
  }
  for (const e of S.entries.values()) {
    e.family_id = fam; if (e.owner_id === oldUid) e.owner_id = uid;
    if (e.photo_path?.startsWith(oldFam + '/')) e.photo_path = fam + e.photo_path.slice(oldFam.length);
    e._dirty = true; await IDB.put('entries', e); await queue({ t: 'entries', id: e.id });
  }
  for (const b of S.babies) if (b.photo_path?.startsWith(oldFam + '/')) { b.photo_path = fam + b.photo_path.slice(oldFam.length); await IDB.put('babies', b); await queue({ t: 'babies', id: b.id }); }
}

/* U-muayeneleri (G-BA Kinder-Richtlinie / Gelbes Heft). d = gün, m = ay (yaş olarak) */
const U_EXAMS = [
  { code: 'U1', from: { d: 0 }, to: { d: 0 }, tol: { d: 0 }, note: 'Doğumdan hemen sonra' },
  { code: 'U2', from: { d: 2 }, to: { d: 9 }, tol: { d: 13 }, note: '3.–10. gün' },
  { code: 'U3', from: { d: 21 }, to: { d: 35 }, tol: { d: 56 }, note: '4.–5. hafta' },
  { code: 'U4', from: { m: 2 }, to: { m: 4 }, tol: { m: 4.5 }, note: '3.–4. ay' },
  { code: 'U5', from: { m: 5 }, to: { m: 7 }, tol: { m: 8 }, note: '6.–7. ay' },

const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function pushState() {
  if (!pushSupported()) return isIOS && !isStandalone() ? 'ios-home' : 'unsupported';
  if (Notification.permission === 'granted' && S.pushOk) return 'subscribed';
  return Notification.permission; // default | granted | denied
}
const b64uBytes = s => { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function subscribePush(ask) {
  if (!S.sb || S.local || !isParent() || !CONFIG.VAPID_PUBLIC || !pushSupported()) return false;
  if (Notification.permission !== 'granted') { if (!ask) return false; if ((await Notification.requestPermission()) !== 'granted') return false; }
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(CONFIG.VAPID_PUBLIC) });
  const j = sub.toJSON();
  const { error } = await S.sb.from('push_subs').upsert({ endpoint: j.endpoint, family_id: S.family, user_id: meId(), p256dh: j.keys.p256dh, auth: j.keys.auth });
  if (error) { console.warn('push sub', error); return false; }
  return (S.pushOk = true);
}
A.pushOn = async () => {
  const ok = await subscribePush(true).catch(e => { console.warn(e); return false; });
  closeSheet(); toast(ok ? 'Bildirimler açık 🔔' : 'Bildirim açılamadı'); render();
};
A.pushTest = async () => { const reg = await navigator.serviceWorker.ready; reg.showNotification('💊 Deneme', { body: 'Bildirimler bu telefonda çalışıyor 🤍', icon: 'icon-192.png', tag: 'ninni-test' }); };

async function ensureAutoFirsts() {
  if (!isParent()) return;
  for (const b of S.babies) {
    if (b.status !== 'born' || !b.birth_date) continue;
    const birth = parseYmd(b.birth_date); if (b.data?.birth_time) { const [h, m] = b.data.birth_time.split(':'); birth.setHours(+h, +m); }
    const idBorn = await detId(b.id + ':first:born');
    if (!S.entries.has(idBorn)) await saveEntry({ id: idBorn, baby_id: b.id, kind: 'first', ts: birth.toISOString(), data: { key: 'born', title: FIRSTS.auto.born[0] } });
    if (daysBetween(birth, new Date()) >= 40) {
      const idK = await detId(b.id + ':first:kirk');
      if (!S.entries.has(idK)) await saveEntry({ id: idK, baby_id: b.id, kind: 'first', ts: new Date(+startOfDay(birth) + 40 * DAY + 12 * 36e5).toISOString(), data: { key: 'kirk', title: FIRSTS.auto.kirk[0] } });
    }
  }
}

/* ── ninni / beyaz gürültü (ekran kilitliyken de çalsın diye <audio> + üretilmiş WAV) */
const Sound = {
  on: false, label: '', timer: null,
  wav(samples, rate) {
    const n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, samples[i])) * 32767, true);
    return new Blob([buf], { type: 'audio/wav' });
  },
  make(type) {
    const rate = 22050;
    if (type === 'lullaby') return this.lullaby(rate);
    const len = rate * 20, out = new Float32Array(len);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
    for (let i = 0; i < len; i++) {
      const wn = Math.random() * 2 - 1;
      if (type === 'white') out[i] = wn * .25;
      else if (type === 'pink') { b0 = .99886 * b0 + wn * .0555179; b1 = .99332 * b1 + wn * .0750759; b2 = .969 * b2 + wn * .153852; b3 = .8665 * b3 + wn * .3104856; b4 = .55 * b4 + wn * .5329522; b5 = -.7616 * b5 - wn * .016898; out[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + wn * .5362) * .06; b6 = wn * .115926; }
      else { last = (last + .02 * wn) / 1.02; out[i] = last * 2.6; }
    }
    if (type === 'womb') { // derin uğultu + yavaş kalp atışı
      const beat = rate * 60 / 68;
      for (let i = 0; i < len; i++) { const p = i % beat; const thump = (p < rate * .09 ? Math.sin(2 * Math.PI * 48 * p / rate) * Math.exp(-p / (rate * .03)) : 0) + (p > rate * .28 && p < rate * .36 ? .6 * Math.sin(2 * Math.PI * 42 * (p - rate * .28) / rate) * Math.exp(-(p - rate * .28) / (rate * .025)) : 0); out[i] = out[i] * .7 + thump * .55; }
    }
    const f = rate * .5; for (let i = 0; i < f; i++) { const g = i / f; out[i] = out[i] * g + out[len - f + i] * (1 - g); } // döngü dikişini yumuşat
    return this.wav(out.subarray(0, len - f), rate);
  },
  lullaby(rate) { // Brahms – Wiegenlied (kamu malı), müzik kutusu tınısı
    const N = { C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392, A4: 440, B4: 493.88, C5: 523.25 };
    const song = [['E4', 1], ['E4', 1], ['G4', 4], ['E4', 1], ['E4', 1], ['G4', 4], ['E4', 1], ['G4', 1], ['C5', 2], ['B4', 3], ['A4', 1], ['A4', 2], ['G4', 2], ['D4', 1], ['E4', 1], ['F4', 2], ['D4', 2], ['D4', 1], ['E4', 1], ['F4', 4], ['D4', 1], ['F4', 1], ['B4', 1], ['A4', 1], ['G4', 2], ['B4', 2], ['C5', 4], ['C4', 1], ['C4', 1], ['C5', 4], ['A4', 1], ['F4', 1], ['G4', 4], ['E4', 1], ['C4', 1], ['F4', 2], ['G4', 2], ['A4', 2], ['G4', 4], ['C4', 1], ['C4', 1], ['C5', 4], ['A4', 1], ['F4', 1], ['G4', 4], ['E4', 1], ['C4', 1], ['F4', 2], ['E4', 2], ['D4', 2], ['C4', 6]];
    const unit = .34, total = song.reduce((s, x) => s + x[1], 0) * unit + 2;
    const out = new Float32Array(Math.ceil(total * rate)); let t0 = .5;
    for (const [n, d] of song) {
      const f = N[n] * 2, start = Math.floor(t0 * rate), len = Math.floor(Math.min(2.2, d * unit + 1.2) * rate);
      for (let i = 0; i < len && start + i < out.length; i++) { const tt = i / rate; const env = Math.exp(-tt * 2.6) * Math.min(1, i / 60); out[start + i] += (Math.sin(2 * Math.PI * f * tt) * .55 + Math.sin(2 * Math.PI * f * 2 * tt) * .15 + Math.sin(2 * Math.PI * f * 3 * tt) * .05) * env * .32; }
      t0 += d * unit;
    }
    return this.wav(out, rate);
  },
  async play(type, label, mins) {
    const p = $('#player'); p.src = URL.createObjectURL(this.make(type)); p.loop = true;
    try { await p.play(); } catch (e) { toast('Ses başlatılamadı'); return; }
    this.on = true; this.label = label; clearTimeout(this.timer);
    if (mins) this.timer = setTimeout(() => this.stop(), mins * 6e4);
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: label, artist: 'Ninni' });
  },
  stop() { const p = $('#player'); p.pause(); this.on = false; this.label = ''; clearTimeout(this.timer); refresh(); },
};

/* ══════════════════════════ AY MEKTUBU ══════════════════════════ */
function parentsSig() {
  const ps = S.members.filter(m => m.role === 'parent').sort((a, b) => (a.parent_kind === 'anne' ? -1 : 1));
  const part = m => m.parent_kind === 'anne' ? `annen ${m.display_name}` : m.parent_kind === 'baba' ? `baban ${m.display_name}` : m.display_name;
  return TR.cap(ps.map(part).join(' ve '));
}
function buildLetter(n) {
  const b = baby(); const birth = birthOf(b); const name = TR.cap(babyName(b));
  const preg = n === 'preg';
  const start = preg ? new Date(0) : addMonths(birth, n - 1), end = preg ? birth : addMonths(birth, n);
  const inR = e => { const d = new Date(e.ts); return d >= start && d < end; };
  const rnd = seeded(b.id + ':' + n);
  const P = [];
  if (preg) P.push(`Sevgili ${name},\nSen daha karnımdayken yazdıklarımız bunlar. Seni beklerken her gün biraz daha tanıdık.`);
  else P.push(pick([
    `Sevgili ${name},\nBugün tam ${n} aylık oldun. Bu ayı sana anlatmak istedik.`,
    `Canım ${name},\nBir ay daha birlikte büyüdük; bugün ${n} aylıksın.`,
    `Küçük ${name},\n${n}. ay dönümün kutlu olsun. Bu ay neler yaşadık, bak:`,
  ], rnd));
  if (!preg && canSeeCare()) {
    const feeds = E('feed').filter(inR).length, dia = E('diaper').filter(inR).length;
    const sl = E('sleep').filter(e => inR(e) && e.end_ts).reduce((s, e) => s + (new Date(e.end_ts) - new Date(e.ts)), 0) / 36e5;
    const bits = []; if (feeds) bits.push(`${feeds} kez karnını doyurduk`); if (sl >= 1) bits.push(`yaklaşık ${Math.round(sl)} saat uyudun`); if (dia) bits.push(`${dia} kez bezini değiştirdik`);
    if (bits.length) P.push(TR.cap(`bu ay ${bits.join(', ').replace(/, ([^,]*)$/, ' ve $1')}. ${pick(['Her biri, sana sarıldığımız bir an demekti.', 'Sayıları bile seninle güzel.', 'Gecenin her saatinde yanındaydık.'], rnd)}`));
  }
  if (!preg) {
    const gr = E('growth').filter(e => new Date(e.ts) < end).sort((a, b) => new Date(a.ts) - new Date(b.ts));
    const last = gr.filter(inR).pop(), before = gr.filter(e => new Date(e.ts) < start).pop() || gr[0];
    if (last?.data.w && before && before !== last && before.data.w) P.push(`Ay başında ${fmtKg(before.data.w)} idin, şimdi ${fmtKg(last.data.w)}.${last.data.h ? ` Boyun ${last.data.h} cm oldu.` : ''}`);
    else if (last?.data.w) P.push(`Bu ay ${fmtKg(last.data.w)} geldin${last.data.h ? `, boyun ${last.data.h} cm` : ''}.`);
  }
  const firsts = E('first').filter(inR).sort((a, b) => new Date(a.ts) - new Date(b.ts)).filter(e => !(preg && e.data.key === 'born'));
  if (firsts.length) P.push((preg ? 'Seni beklerken ilk kez:\n' : 'Bu ay ilk kez:\n') + firsts.map(e => `• ${e.data.title} (${fmtDate(e.ts)})${e.data.text ? ' — ' + e.data.text : ''}`).join('\n'));
  const moms = [...E('moment'), ...E('ultra'), ...E('heart')].filter(e => inR(e) && (e.data.text || e.data.bpm)).sort((a, b) => new Date(a.ts) - new Date(b.ts)).slice(0, 14);
  if (moms.length) P.push('Küçük anlar:\n' + moms.map(e => `• ${fmtDate(e.ts)} — ${e.data.text || (e.kind === 'heart' ? 'kalbinin sesini duyduk (' + e.data.bpm + ')' : '')}`).join('\n'));
  const notes = E('note').filter(inR);
  const byOwner = {}; notes.forEach(e => (byOwner[e.owner_id] = byOwner[e.owner_id] || []).push(e));
  for (const [uid, arr] of Object.entries(byOwner)) {
    const m = S.members.find(x => x.user_id === uid); const who = m?.relation ? `${TR.cap(TR.poss2(m.relation))} ${m.display_name}` : (m?.display_name || 'Seni seven biri');
    P.push(`${who} de sana yazdı:\n` + arr.map(e => `“${e.data.text}”`).join('\n'));
  }
  const lnotes = E('letternote').filter(e => e.data.month == n && e.data.text);
  for (const e of lnotes) { const m = S.members.find(x => x.user_id === e.owner_id); P.push(`${e.data.text}\n— ${m?.parent_kind === 'anne' ? 'Annen' : m?.parent_kind === 'baba' ? 'Baban' : m?.display_name || ''}`); }
  P.push(pick(['Seni her gün biraz daha çok seviyoruz.', 'İyi ki geldin, iyi ki bizimlesin.', 'Uykusuz gecelerin en güzel sebebi sensin.', 'Büyüdükçe kalbimiz de büyüyor.'], rnd));
  const photos = [];
  const mp = monthlySeries().find(m => m.month == n)?.e; if (mp) photos.push(mp.photo_path);
  [...E('first'), ...E('moment'), ...E('ultra')].filter(e => inR(e) && e.photo_path && !photos.includes(e.photo_path)).slice(0, 3).forEach(e => photos.push(e.photo_path));
  return { title: preg ? `${TR.dat(name)} · Seni beklerken` : `${TR.dat(name)} ${n}. ay mektubu`, paras: P, sig: parentsSig(), photos, n };
}
const fmtKg = w => `${(+w).toLocaleString('tr-TR', { maximumFractionDigits: 2 })} kg`;

/* ══════════════════════════ BÜYÜME KARELERİ (çekim yardımcısı + değişim videosu) ══════════════════════════
   Takvim yok, "kaçırma" yok: kart hep durur. Ritim günlük (varsayılan) ya da haftalık; sadece kartın ne zaman
   yukarı çıkacağını belirler. Kareler günlük/haftalık/aylık serilere ayrılır (aylık: ay dönümüne ±3 gün).
   Kareler 9:16, 1125×2000 px saklanır (videoda keskin olsun diye). */
const FRAME_W = 1125, FRAME_H = 2000;
const frameRhythm = () => S.prefs.frameRhythm || 'daily';
const frameUrgentDays = () => frameRhythm() === 'daily' ? 3 : 10;
const frameDay = ts => daysBetween(birthOf(), ts);
const dayLabel2 = n => n <= 0 ? 'Doğduğu gün' : `${n}. gün`;
function lastPer(keyFn) { const m = new Map(); for (const e of frames()) m.set(keyFn(e), e); return [...m.values()]; } // her gruptaki SON kare
const dailySeries = () => lastPer(e => ymd(e.ts)).map(e => ({ e, label: dayLabel2(frameDay(e.ts)) }));
const weeklySeries = () => lastPer(e => e.data.week || frameWeek(e.ts)).map(e => ({ e, label: `${e.data.week || frameWeek(e.ts)}. hafta` }));
const seriesOf = k => k === 'm' ? monthlySeries().map(m => ({ e: m.e, label: `${m.month}. ay` })) : k === 'w' ? weeklySeries() : dailySeries();
const frames = () => [...E('frame'), ...E('mphoto')].sort((a, b) => new Date(a.ts) - new Date(b.ts)); // eski → yeni
const frameWeek = ts => Math.floor(daysBetween(birthOf(), ts) / 7) + 1;
function frameMonth(ts) {
  const birth = birthOf();
  for (let n = 1; n <= 72; n++) { const off = daysBetween(addMonths(birth, n), ts); if (Math.abs(off) <= 3) return n; if (off < -3) break; }
  return null;
}
const frameMonthOf = e => e.kind === 'mphoto' ? e.data.month : e.data.month || null;
function monthlySeries() { const m = new Map(); for (const e of frames()) { const n = frameMonthOf(e); if (n) m.set(n, e); } return [...m].sort((a, b) => a[0] - b[0]).map(([month, e]) => ({ month, e })); }
const fmtNum = d => { d = new Date(d); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; };

function frameCard(position) {
  const b = baby(); if (!isParent() || b?.status !== 'born') return '';
  const fr = frames(); const last = fr[fr.length - 1];
  const days = last ? daysBetween(last.ts, new Date()) : null;
  const urgent = !last || days >= frameUrgentDays();
  if ((position === 'top') !== urgent) return '';
  const n = dailySeries().length;
  const when = !last ? 'Henüz ilk kare yok. İlkini bugün çekebilirsin; her kare değişim videosuna eklenir.'
    : days === 0 ? `Bugün çekildi ✓ · ${n} gün` : days === 1 ? `En son dün çekildi · ${n} gün`
    : `En son ${days} gün önce (${fmtNum(last.ts)}) çekildi`;
  return `<div class="card ${urgent ? '' : 'soft'} row">${last ? `<div class="avatar" style="border-radius:12px;width:46px;height:62px" data-photo="${last.photo_path}"></div>` : `<div style="font-size:1.8rem">📸</div>`}
    <div class="grow"><h3 style="${urgent ? '' : 'font-size:.95rem'}">Büyüme karesi</h3><p class="muted small">${when}</p></div>
    <button class="btn sm ${urgent ? '' : 'ghost'}" data-act="frameShoot">Çek</button></div>`;
}

A.frameShoot = async () => {
  const fr = frames(); const prev = fr[fr.length - 1];
  const ghost = prev ? await photoURL(prev.photo_path) : null;
  const shot = await openCamera(ghost); if (!shot) return;
  const aligned = await alignEditor(shot, ghost); if (!aligned) return;

const GUIDES = `<svg class="guides" viewBox="0 0 90 160" preserveAspectRatio="none" aria-hidden="true">
  <g fill="none" stroke="#fff" stroke-opacity=".75" stroke-width=".5" stroke-dasharray="2 1.6">
    <ellipse cx="45" cy="62" rx="21" ry="27"/><line x1="27" y1="58" x2="63" y2="58"/><line x1="45" y1="8" x2="45" y2="152" stroke-opacity=".3"/>
    <path d="M6 132 Q45 100 84 132"/></g></svg>`;
function camShell(inner, hint) {
  return `<style>
    #cam .stage{position:absolute;left:50%;top:calc(var(--safe-t) + 64px);transform:translateX(-50%);height:calc(100dvh - var(--safe-t) - var(--safe-b) - 212px);aspect-ratio:9/16;max-width:100vw;overflow:hidden;border-radius:18px;background:#111;touch-action:none}
    #cam .stage video,#cam .stage .shotimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center}
    #cam .stage .ghost2{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
    #cam .guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    #cam .hint{position:absolute;top:calc(var(--safe-t) + 10px);left:16px;right:16px;text-align:center;color:#fff;font-weight:700;font-size:.82rem;line-height:1.3}
    #cam .op{position:absolute;left:24px;right:24px;bottom:calc(var(--safe-b) + 112px);display:flex;align-items:center;gap:10px;color:#fff;font-size:.8rem}
    #cam .op input{flex:1}
  </style><div class="hint">${hint}</div>${inner}`;
}
async function openCamera(ghostURL) {
  if (!navigator.mediaDevices?.getUserMedia) { const [f] = await pickFiles(); return f || null; }
  let stream, facing = S.prefs.camFacing || 'environment';
  const cam = $('#cam');
  return new Promise(async resolve => {
    const done = v => { stream?.getTracks().forEach(t => t.stop()); cam.classList.remove('open'); cam.innerHTML = ''; resolve(v); };
    cam.innerHTML = camShell(`<div class="stage"><video playsinline autoplay muted></video>${ghostURL ? `<img class="ghost2" src="${ghostURL}" style="opacity:.35">` : ''}${GUIDES}</div>
      ${ghostURL ? `<div class="op"><span>önceki kare</span><input type="range" min="0" max="80" value="35" id="ghOp"></div>` : ''}
      <div class="bar"><button data-c="x">Vazgeç</button><button class="shot" data-c="shot" aria-label="Çek"></button><button data-c="flip">↺ Kamera</button></div>
      <div style="position:absolute;bottom:calc(var(--safe-b) + 150px);left:0;right:0;text-align:center"><button data-c="gal" style="color:#fff;text-decoration:underline;font-size:.85rem">Galeriden seç</button></div>`,
      ghostURL ? 'Önceki karenin üstüne otur: yüz ovalin içinde, gözler çizgide' : 'Yüz ovalin içinde, gözler çizgide; her seferinde aynı köşe');
    cam.classList.add('open');
    const video = $('video', cam), stage = $('.stage', cam);
    $('#ghOp', cam)?.addEventListener('input', e => { $('.ghost2', cam).style.opacity = e.target.value / 100; });
    const start = async () => {
      stream?.getTracks().forEach(t => t.stop());
      try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 2560 }, height: { ideal: 1440 } }, audio: false }); video.srcObject = stream; }
      catch (e) { cam.classList.remove('open'); cam.innerHTML = ''; const [f] = await pickFiles(); resolve(f || null); }
    };

/* ── değişim videosu: telefonda üretilir (canvas + MediaRecorder), sunucuya hiçbir şey gitmez */
async function makeTimelapse(items, per, onProg) {
  await ensureFonts();
  if (items.length < 2) throw new Error('en az 2 kare');
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
  // Kareler SIRAYLA yüklenir ve bırakılır: 365 kareyi birden belleğe almak iPhone'u çökertir.
  const cache = new Map();
  const load = i => {
    if (i < 0 || i >= items.length) return null;
    if (cache.has(i)) return cache.get(i);
    const p = (async () => {
      const b = await photoBlob(items[i].e.photo_path); if (!b) { cache.set(i, { img: null }); return null; }
      const url = URL.createObjectURL(b); const img = new Image(); img.src = url;
      try { await Promise.race([img.decode(), sleep(1500)]); } catch (e) { } // decode bazı durumlarda hiç dönmeyebiliyor
      const v = { img, url }; cache.set(i, v); return v;
    })();
    cache.set(i, p); return p;
  };
  const ready = i => { const v = cache.get(i); return v && !(v instanceof Promise) ? v.img : null; };
  let shown = null; // ekrandaki son kare: yenisi henüz yüklenmediyse bu gösterilir, o yüzden ASLA bırakılmaz
  const release = below => { for (const [k, v] of cache) if (k < below && !(v instanceof Promise) && (below === Infinity || v.img !== shown)) { if (v.url) URL.revokeObjectURL(v.url); if (v.img) v.img.src = ''; cache.delete(k); } };
  for (let i = 0; i < Math.min(5, items.length); i++) { await load(i); onProg?.(i / 5 * .1, 'Kareler hazırlanıyor…'); }
  await load(items.length - 1);
  const imgs = { length: items.length }; // aşağıdaki çizim kodu için uyumluluk
  const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!mime || !c.captureStream) throw new Error('Bu tarayıcı video kaydını desteklemiyor');
  const paper = document.createElement('canvas'); paper.width = W; paper.height = H; paperBg(paper.getContext('2d'), W, H, seeded('tl'));
  const name = TR.cap(babyName());
  const cover = (im, a = 1) => { const sc = Math.max(W / im.width, H / im.height); ctx.globalAlpha = a; ctx.drawImage(im, (W - im.width * sc) / 2, (H - im.height * sc) / 2, im.width * sc, im.height * sc); ctx.globalAlpha = 1; };
  const hand = (txt, size, y, color = '#fff', shadow = true) => { ctx.save(); ctx.font = `600 ${size}px Caveat`; ctx.textAlign = 'center'; ctx.fillStyle = color; if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 18; } ctx.fillText(txt, W / 2, y); ctx.restore(); };
  const brandMark = () => { ctx.save(); ctx.globalAlpha = .55; ctx.fillStyle = '#fff'; ctx.font = '700 28px Nunito'; ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 8; ctx.fillText('ninni', W / 2, H - 60); ctx.restore(); };
  const fade = Math.min(.3, per * .45), intro = 1.6, outro = 2.2, total = intro + imgs.length * per + outro;
  shown = ready(0);
  const draw = t => {
    if (t < intro) { ctx.drawImage(paper, 0, 0); hand(name, 150, H / 2 - 20, inkColor(), false); hand('büyüyor…', 90, H / 2 + 100, TEXT_INK, false); ctx.globalAlpha = 1; return; }
    const tt = t - intro;
    if (tt < imgs.length * per) {
      const i = Math.floor(tt / per), local = tt - i * per;
      for (let k = 1; k <= 6; k++) load(i + k);
      const cur = ready(i), prev = ready(i - 1);
      if (cur) shown = cur;
      release(i - 1);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      if (cur && prev && local < fade) { cover(prev); cover(cur, local / fade); } else if (shown) cover(shown);
      hand(items[i].label, 96, H - 170); brandMark(); return;
    }
    const last = ready(items.length - 1) || shown; if (last) cover(last);
    ctx.fillStyle = 'rgba(251,246,236,.82)'; ctx.fillRect(0, 0, W, H);
    hand(name, 130, H / 2 - 30, inkColor(), false); hand(items[0].label + ' → ' + items[items.length - 1].label, 70, H / 2 + 70, TEXT_INK, false);
    ctx.save(); ctx.globalAlpha = .35; ctx.fillStyle = TEXT_INK; ctx.font = '700 30px Nunito'; ctx.textAlign = 'center'; ctx.fillText('ninni', W / 2, H - 60); ctx.restore();

A.exportAll = async (_, btn) => {
  btn.disabled = true; btn.textContent = 'Hazırlanıyor…';

  const paths = new Set([...entries.map(e => e.photo_path), ...S.babies.map(b => b.photo_path)].filter(Boolean));
  const parts = [`{"app":"ninni","version":1,"exported_at":"${nowISO()}","babies":${JSON.stringify(S.babies.map(b => only(b, BABY_COLS)))},"members":${JSON.stringify(S.members.map(m => ({ user_id: m.user_id, display_name: m.display_name, role: m.role, parent_kind: m.parent_kind, relation: m.relation })))},"entries":${JSON.stringify(entries.map(e => only(e, ENTRY_COLS)))},"photos":{`];

A.importAll = async () => {
  const [f] = await pickFiles({ accept: 'application/json,.json' }); if (!f) return;
  try {
    const data = JSON.parse(await f.text()); if (data.app !== 'ninni') throw 0;
    const pathMap = {};
    for (const [p, durl] of Object.entries(data.photos || {})) {
      const np = `${S.family}/${p.split('/').pop()}`; pathMap[p] = np;
      if (!(await localBlob(np))) { const blob = await (await fetch(durl)).blob(); await putBlob(np, blob); await queue({ t: 'upload', path: np }); }
    }
    for (const b of data.babies || []) if (!S.babies.find(x => x.id === b.id)) await saveBaby({ ...b, family_id: S.family, photo_path: pathMap[b.photo_path] || b.photo_path });
    let n = 0;
    for (const e of data.entries || []) {
      if (S.entries.has(e.id)) continue;
      if (e.subject === 'self' && e.owner_id !== meId()) continue; // başkasının kişisel kayıtları içe alınmaz
      await saveEntry({ ...e, owner_id: meId(), photo_path: pathMap[e.photo_path] || e.photo_path, family_id: S.family }); n++;

/* ══════════════════════════ KAĞIT KARTLAR (story, mektup, kitap) ══════════════════════════ */
const INK = { girl: '#b5627e', boy: '#4f7ca8', wait: '#8f72b8' };
const inkColor = () => INK[document.documentElement.dataset.theme] || INK.girl;
const TEXT_INK = '#3b3546';

function wrap(ctx, text, maxW) {

    let line = '';

function polaroid(ctx, img, cx, top, maxW, maxH, rnd) {

  for (const sx of [-1, 1]) { ctx.save(); ctx.translate(sx * (iw / 2 - pad), -(ih + pad + bottom) / 2); ctx.rotate(sx * .5); ctx.fillRect(-maxW * .07, -maxW * .02, maxW * .14, maxW * .04); ctx.restore(); }
  ctx.restore(); return ih + pad + bottom;

async function storyCanvas({ title, text, photo, sub, seed }) {
  await ensureFonts();
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d'); const rnd = seeded(seed || title);
  paperBg(ctx, W, H, rnd);
  ctx.textAlign = 'center'; ctx.fillStyle = inkColor(); ctx.font = '600 92px Caveat';
  let y = 230; for (const l of wrap(ctx, title, W - 180)) { ctx.fillText(l, W / 2, y); y += 96; }
  ctx.save(); ctx.strokeStyle = inkColor(); ctx.globalAlpha = .45; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); // el çizimi dalga
  for (let x = 0; x <= 260; x += 4) ctx.lineTo(W / 2 - 130 + x, y - 62 + Math.sin(x / 18 + rnd()) * 5); ctx.stroke(); ctx.restore(); y += 10;
  if (sub) { ctx.fillStyle = 'rgba(59,53,70,.55)'; ctx.font = '400 34px Nunito'; ctx.fillText(sub, W / 2, y - 20); y += 50; }
  if (photo) { const img = await blobImage(photo); y += 30; y += polaroid(ctx, img, W / 2, y, 860, text ? 900 : 1150, rnd) + 70; }
  if (text) {
    let fs = 70; ctx.font = `400 ${fs}px Caveat`; let lines = wrap(ctx, text, W - 200);
    while ((lines.length * fs * 1.2 > H - y - 200) && fs > 40) { fs -= 4; ctx.font = `400 ${fs}px Caveat`; lines = wrap(ctx, text, W - 200); }
    ctx.fillStyle = TEXT_INK; if (!photo) y = Math.max(y, (H - lines.length * fs * 1.2) / 2);
    for (const l of lines) { if (y > H - 200) break; ctx.fillText(l, W / 2, y + fs); y += fs * 1.2; }

}
const canvasBlob = (c, q = .9) => new Promise(r => c.toBlob(r, 'image/jpeg', q));

/* ── sayfalara akıtma (mektup PDF, mektup story'leri, yıl kitabı) */
async function renderPages(blocks, { W, H, pad, bleed = 0, seed = 'p', pageNo = false, startNo = 1 }) {
  await ensureFonts();
  const pages = []; const rnd = seeded(seed); const fs = Math.round(W * .046), lh = fs * 1.28;
  let c, ctx, y;
  const newPage = () => { c = document.createElement('canvas'); c.width = W; c.height = H; ctx = c.getContext('2d'); paperBg(ctx, W, H, rnd); y = pad; pages.push(c); };
  const finish = () => pages.forEach((p, i) => { const x = p.getContext('2d'); brand(x, W, H - bleed, Math.round(fs * .42)); if (pageNo) { x.save(); x.globalAlpha = .4; x.fillStyle = TEXT_INK; x.font = `400 ${Math.round(fs * .45)}px Nunito`; x.textAlign = 'center'; x.fillText(String(startNo + i), W / 2, H - bleed - fs * 2.4); x.restore(); } });
  newPage();
  const maxW = W - pad * 2, bottom = H - pad - fs * 1.5;
  for (const bl of blocks) {
    if (bl.type === 'break') { if (y > pad) newPage(); continue; }
    if (bl.type === 'title') { ctx.font = `600 ${fs * 1.55}px Caveat`; const ls = wrap(ctx, bl.text, maxW); if (y + ls.length * fs * 1.6 > bottom) newPage(); ctx.fillStyle = inkColor(); ctx.textAlign = 'center'; for (const l of ls) { y += fs * 1.6; ctx.fillText(l, W / 2, y); } y += fs * .8; continue; }
    if (bl.type === 'photo' || bl.type === 'bigphoto') {
      const img = await blobImage(bl.blob); const maxH = bl.type === 'bigphoto' ? bottom - pad - fs * 2 : H * .38;
      const s = Math.min(maxW * .86 / img.width, maxH / img.height); const need = img.height * s + maxW * .2;
      if (y + need > bottom) newPage();
      y += polaroid(ctx, img, W / 2, y + fs * .5, maxW * .86, maxH, rnd) + fs * 1.4; continue;
    }
    if (bl.type === 'grid') {
      const cols = 3, gap = maxW * .03, cell = (maxW - gap * (cols - 1)) / cols; const rows = Math.ceil(bl.blobs.length / cols);
      if (y + rows * (cell + gap + fs) > bottom) newPage();
      for (let i = 0; i < bl.blobs.length; i++) {
        const img = await blobImage(bl.blobs[i]); const x0 = pad + (i % cols) * (cell + gap), y0 = y + Math.floor(i / cols) * (cell + gap + fs);
        const s = Math.max(cell / img.width, cell / img.height); ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, cell, cell); ctx.clip();
        ctx.drawImage(img, x0 + (cell - img.width * s) / 2, y0 + (cell - img.height * s) / 2, img.width * s, img.height * s); ctx.restore();
        ctx.fillStyle = TEXT_INK; ctx.font = `400 ${fs * .8}px Caveat`; ctx.textAlign = 'center'; ctx.fillText(bl.labels?.[i] || '', x0 + cell / 2, y0 + cell + fs * .85);
      }
      y += rows * (cell + gap + fs) + fs; continue;
    }
    const sig = bl.type === 'sig'; ctx.font = `400 ${fs}px Caveat`; ctx.fillStyle = TEXT_INK; ctx.textAlign = sig ? 'right' : 'left';
    for (const l of wrap(ctx, bl.text, maxW)) { if (y + lh > bottom) { newPage(); ctx.font = `400 ${fs}px Caveat`; ctx.fillStyle = TEXT_INK; ctx.textAlign = sig ? 'right' : 'left'; } y += lh; ctx.fillText(l, sig ? W - pad : pad, y); }
    y += lh * .55;
  }
  finish(); return pages;
}
async function letterBlocks(n, { withPhotos = true } = {}) {
  const L = buildLetter(n); const blocks = [{ type: 'title', text: L.title }];
  if (withPhotos && L.photos[0]) { const b = await photoBlob(L.photos[0]); if (b) blocks.push({ type: 'photo', blob: b }); }
  L.paras.forEach(p => blocks.push({ type: 'p', text: p }));
  blocks.push({ type: 'sig', text: L.sig });
  if (withPhotos) for (const p of L.photos.slice(1)) { const b = await photoBlob(p); if (b) blocks.push({ type: 'photo', blob: b }); }
  return { L, blocks };
}
A.letterStory = async (d, btn) => {
  btn.disabled = true; btn.textContent = 'Hazırlanıyor…';
  const n = d.n === 'preg' ? 'preg' : +d.n; const { blocks } = await letterBlocks(n);
  const pages = await renderPages(blocks, { W: 1080, H: 1920, pad: 110, seed: 'ls' + n });
  const files = []; for (const [i, p] of pages.entries()) files.push(new File([await canvasBlob(p)], `ninni-mektup-${n}-${i + 1}.jpg`, { type: 'image/jpeg' }));
  btn.disabled = false; btn.textContent = 'Story olarak paylaş ✨';
  await shareFiles(files, 'Ninni mektubu');
};
async function jsPDFReady() { if (!window.jspdf) await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'); return window.jspdf.jsPDF; }
A.letterPDF = async (d, btn) => {
  btn.disabled = true; btn.textContent = 'Hazırlanıyor…';
  try {
    const jsPDF = await jsPDFReady(); const n = d.n === 'preg' ? 'preg' : +d.n; const { L, blocks } = await letterBlocks(n);
    const pages = await renderPages(blocks, { W: 1166, H: 1654, pad: 130, seed: 'lp' + n });
    const pdf = new jsPDF({ unit: 'mm', format: 'a5', compress: true });
    pages.forEach((p, i) => { if (i) pdf.addPage('a5'); pdf.addImage(p.toDataURL('image/jpeg', .9), 'JPEG', 0, 0, 148, 210); });
    const file = new File([pdf.output('blob')], `${L.title}.pdf`, { type: 'application/pdf' });
    await shareFiles([file], L.title);
  } catch (e) { console.warn(e); toast('PDF hazırlanamadı; internet bağlantısı gerekebilir'); }
  btn.disabled = false; btn.textContent = 'PDF';
};

/* ── 12 aylık kolaj */
A.collage = async (d, btn) => {
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  const mph = monthlySeries().slice(0, 12);
  const blobs = (await Promise.all(mph.map(m => photoBlob(m.e.photo_path)))); const ok = mph.map((m, i) => [m, blobs[i]]).filter(x => x[1]);
  if (ok.length < 2) { if (btn) { btn.disabled = false; btn.textContent = 'Aylık kolaj'; } return toast('Kolaj için en az 2 aylık kare gerekiyor'); }
  const pages = await renderPages([{ type: 'title', text: `${TR.cap(babyName())} · ${ok.length === 12 ? 'ilk yılı' : 'ilk ' + ok[ok.length - 1][0].month + ' ay'}` }, { type: 'grid', blobs: ok.map(x => x[1]), labels: ok.map(x => x[0].month + '. ay') }], { W: 1080, H: 1920, pad: 90, seed: 'col' });
  const blob = await canvasBlob(pages[0]); const file = new File([blob], 'ninni-kolaj.jpg', { type: 'image/jpeg' });
  if (btn) { btn.disabled = false; btn.textContent = 'Kolaj'; }
  openSheet(`<img class="preview-img" src="${URL.createObjectURL(blob)}"><button class="btn block" style="margin-top:14px" id="shC">Paylaş ✨</button>`, r => $('#shC', r).onclick = () => shareFiles([file], 'Ninni'));
};

/* ── yıl kitabı: A5, her kenarda 3 mm taşma payı, 300 dpi, sayfa sayısı 4'ün katı */
A.book = async (d, btn) => {
  const b = baby(); const birth = birthOf(b); const months = Math.min(12, monthsOld(birth));
  openSheet(`<h2>📚 Yıl kitabı</h2><p>${months < 12 ? `Şu ana kadarki ${months} ay ile bir ön kitap hazırlayacağız; ${TR.cap(babyName())} 1 yaşına girdiğinde tamamı hazır olur.` : 'İlk yılın tamamı hazır.'}</p>
    <p class="muted small">A5 (148×210 mm) · her kenarda 3 mm taşma payı · 300 dpi · sayfa sayısı 4'ün katı. Dijital matbaalar bu dosyayı doğrudan basabilir.</p>
    <button class="btn block" id="bkGo">PDF'i hazırla</button><p class="muted tiny center" id="bkSt" style="margin-top:10px"></p>`, root => $('#bkGo', root).onclick = () => makeBook(months));
};
async function makeBook(months) {
  const st = $('#bkSt'), go = $('#bkGo'); go.disabled = true;
  try {
    st.textContent = 'Sayfalar hazırlanıyor…';
    const jsPDF = await jsPDFReady(); const b = baby(); const name = TR.cap(babyName(b)); const birth = birthOf(b);
    const BLEED = 35, W = 1819, H = 2551, pad = BLEED + 190; // 3 mm ≈ 35 px; 16 mm güvenli kenar
    const all = [];
    const add = async (blocks, seed) => { const ps = await renderPages(blocks, { W, H, pad, bleed: BLEED, seed, pageNo: true, startNo: all.length + 1 }); all.push(...ps); };
    // kapak
    const cover = [{ type: 'break' }, { type: 'title', text: `${TR.gen(name)} İlk Yılı` }];
    if (b.photo_path) { const pb = await photoBlob(b.photo_path); if (pb) cover.push({ type: 'bigphoto', blob: pb }); }
    cover.push({ type: 'sig', text: `${fmtDateY(birth)}\n${parentsSig()}` });
    await add(cover.slice(1), 'cover');
    const stories = E('story'); for (const s of stories) await add([{ type: 'title', text: t('story_t') }, ...STORY_Q.filter(([k]) => s.data.answers?.[k]).flatMap(([k, q]) => [{ type: 'p', text: q.toLocaleUpperCase('tr') }, { type: 'p', text: s.data.answers[k] }]), { type: 'sig', text: '— ' + whoLabel(s.owner_id) }], 'st' + s.id);
    if (['moment', 'ultra', 'heart'].flatMap(k => E(k)).some(e => new Date(e.ts) < birth)) { const { blocks } = await letterBlocks('preg'); await add(blocks, 'preg'); }
    for (let n = 1; n <= months; n++) {
      st.textContent = `${n}. ay…`;
      const mp = monthlySeries().find(m => m.month === n)?.e; const blocks = [];
      if (mp) { const pb = await photoBlob(mp.photo_path); if (pb) blocks.push({ type: 'title', text: `${n}. ay` }, { type: 'bigphoto', blob: pb }, { type: 'break' }); }
      const lb = await letterBlocks(n); await add([...blocks, ...lb.blocks], 'm' + n);
    }
    const firsts = E('first').sort((a, b) => new Date(a.ts) - new Date(b.ts));
    if (firsts.length) {
      const fb = [{ type: 'title', text: 'İlklerimiz' }];
      for (const f of firsts) { fb.push({ type: 'p', text: `${f.data.title} — ${fmtDateY(f.ts)}${f.data.text ? '\n' + f.data.text : ''}` }); if (f.photo_path) { const pb = await photoBlob(f.photo_path); if (pb) fb.push({ type: 'photo', blob: pb }); } }
      await add(fb, 'firsts');
    }
    const mph = monthlySeries().slice(0, 12);
    if (mph.length > 1) { const bl = (await Promise.all(mph.map(m => photoBlob(m.e.photo_path)))); const ok = mph.map((m, i) => [m, bl[i]]).filter(x => x[1]); await add([{ type: 'title', text: 'Ay ay büyüdün' }, { type: 'grid', blobs: ok.map(x => x[1]), labels: ok.map(x => x[0].month + '. ay') }], 'grid'); }
    while (all.length % 4) await add([{ type: 'p', text: '' }], 'blank' + all.length);
    st.textContent = `${all.length} sayfa · PDF oluşturuluyor…`;
    const mmW = 148 + 6, mmH = 210 + 6;
    const pdf = new jsPDF({ unit: 'mm', format: [mmW, mmH], compress: true });
    all.forEach((p, i) => { if (i) pdf.addPage([mmW, mmH]); pdf.addImage(p.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, mmW, mmH); p.width = p.height = 0; });
    const file = new File([pdf.output('blob')], `${name}-yil-kitabi-A5-tasmali.pdf`, { type: 'application/pdf' });
    st.textContent = 'Hazır 🤍'; await shareFiles([file], 'Yıl kitabı');
  } catch (e) { console.warn(e); st.textContent = 'Hazırlanamadı; internet bağlantısı gerekebilir.'; }
  go.disabled = false;
}

/* ══════════════════════════ AÇILIŞ ══════════════════════════ */
let loopsStarted = false;
async function afterLogin() {
  if (S.me?.localOnly && S.sb && S.online) { try { await migrateLocalToCloud(); toast('Anılar buluta taşındı 🤍'); } catch (e) { console.warn('migrate', e); } }
  S.local = !S.sb || !!S.me?.localOnly;
  await ensureAutoFirsts();
  if (!S.local) { subscribe(); sync(); subscribePush(false).then(ok => ok && refresh()).catch(() => { }); }
  if (loopsStarted) return; loopsStarted = true;
  setInterval(() => { if (!document.hidden) sync(); }, 60000);
  setInterval(touchPresence, 120000); touchPresence();
  setInterval(() => { if (!document.hidden) ensureAutoFirsts(); }, 30 * 60000);
}
addEventListener('online', () => { S.online = true; afterLogin(); refresh(); });
addEventListener('offline', () => { S.online = false; refresh(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) { sync(); touchPresence(); updateNight(); refresh(); } });

navigator.serviceWorker?.addEventListener('message', e => { // açık uygulamada bildirime dokunuldu
  if (e.data?.tab && S.screen === 'main') { S.tab = e.data.tab; closeSheet(); render(); sync(); }
});
async function boot() {
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  try { navigator.storage?.persist?.(); } catch (e) { }
  await loadLocal();
  initSupabase();
  const jm = location.hash.match(/join=([A-Z0-9-]+)/i);
  if (S.sb) {
    try { const { data: { session } } = await S.sb.auth.getSession(); S.session = session; } catch (e) { }
    S.sb.auth.onAuthStateChange((_e, s) => { S.session = s; });
  }
  S.local = !S.sb || !!S.me?.localOnly;
  if (S.me) {
    if (S.sb && S.session && S.session.user.id !== S.me.user_id && !S.me.localOnly) { // başka hesapla döndü (Google)
      const mem = await findMembership(); if (mem) { S.me = { user_id: mem.user_id, family_id: mem.family_id, display_name: mem.display_name, role: mem.role, parent_kind: mem.parent_kind, relation: mem.relation, show_awake: mem.show_awake }; S.family = mem.family_id; await kv.set('me', S.me); }
    }
    const qtab = new URLSearchParams(location.search).get('tab'); // bildirimden açıldıysa ilgili sekme
    if (qtab && ['today', 'mem', 'child', 'list', 'me'].includes(qtab)) S.tab = qtab;
    if (jm || qtab) history.replaceState(null, '', location.pathname);
    S.screen = 'main'; render(); afterLogin(); return;
  }
  if (jm) S.pendingJoin = { code: jm[1].toUpperCase().replace(/[^A-Z0-9]/g, '') };
  if (S.sb && S.session && !S.pendingJoin) { // oturum var ama yerel kayıt yok (ör. bir aileden çıkarıldı, başka ailesi var)
    const mem = await findMembership().catch(() => null);
    if (mem) { await enterAs(mem); return; }
  }
  if (isIOS && !isStandalone() && !(await kv.get('gateSkip'))) { S.screen = 'gate'; render(); return; }
  if (S.pendingJoin) { S.screen = 'join'; render(); if (S.pendingJoin.code && S.sb) A.joinLookup(); return; }
  S.screen = 'ob'; render();
}
boot();
